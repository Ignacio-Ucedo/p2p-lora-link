<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor serial · p2p-lora-link</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --fg: #c9d1d9; --dim: #8b949e; --accent: #2f81f7;
    --ok: #3fb950; --err: #f85149; --warn: #d29922;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 10px 14px; background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 15px; margin: 0 10px 0 0; font-weight: 600; }
  .grow { flex: 1; }
  label { color: var(--dim); font-size: 12px; }
  select, input, button {
    background: #0d1117; color: var(--fg);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 10px; font: inherit;
  }
  button { cursor: pointer; background: var(--panel); }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--err); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); display: inline-block; }
  .dot.on { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .dot.off { background: var(--err); }

  #log {
    flex: 1; overflow-y: auto; padding: 10px 14px; margin: 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px; white-space: pre-wrap; word-break: break-word;
  }
  .line { display: flex; gap: 10px; }
  .ts { color: var(--dim); flex: none; user-select: none; }
  .rx { color: var(--fg); }
  .tx { color: var(--accent); }
  .sys { color: var(--warn); font-style: italic; }
  .errline { color: var(--err); }
  /* resaltado suave de niveles de log del firmware */
  .lvl-E { color: var(--err); }
  .lvl-W { color: var(--warn); }
  .lvl-I { color: var(--ok); }

  footer {
    display: flex; gap: 8px; padding: 10px 14px;
    background: var(--panel); border-top: 1px solid var(--border);
  }
  footer input[type=text] { flex: 1; font-family: ui-monospace, monospace; }
  .hint { padding: 4px 14px; font-size: 11px; color: var(--dim); background: var(--panel); }
  .unsupported {
    margin: 40px auto; max-width: 520px; padding: 20px;
    background: var(--panel); border: 1px solid var(--err); border-radius: 8px;
  }
  code { background: #0d1117; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>

<header>
  <h1>Monitor serial</h1>
  <span id="dot" class="dot off" title="desconectado"></span>
  <span id="status" style="color:var(--dim)">desconectado</span>

  <span class="grow"></span>

  <label>baud
    <select id="baud">
      <option>9600</option>
      <option>57600</option>
      <option selected>115200</option>
      <option>230400</option>
      <option>460800</option>
      <option>921600</option>
    </select>
  </label>
  <label><input type="checkbox" id="autoscroll" checked> autoscroll</label>
  <label><input type="checkbox" id="timestamps" checked> hora</label>
  <button id="clear">Limpiar</button>
  <button id="save">Guardar .log</button>
  <button id="connect" class="primary">Conectar</button>
</header>

<pre id="log" aria-live="polite"></pre>

<footer>
  <input type="text" id="input" placeholder="Enviar línea al puerto (Enter)… — fase 1: el firmware aún no parsea comandos por serial" autocomplete="off" spellcheck="false">
  <label style="align-self:center"><input type="checkbox" id="crlf" checked> CRLF</label>
  <button id="send">Enviar</button>
</footer>
<div class="hint">Web Serial (solo Chrome/Edge). El puerto es exclusivo: cerrá esta pestaña antes de flashear con <code>espflash</code>.</div>

<script>
(() => {
  "use strict";

  const $ = (id) => document.getElementById(id);
  const logEl = $("log");

  // --- navegador sin Web Serial ---
  if (!("serial" in navigator)) {
    document.body.innerHTML =
      '<div class="unsupported"><h2>Web Serial no disponible</h2>' +
      '<p>Este monitor necesita <b>Chrome</b> o <b>Edge</b> (Chromium). ' +
      'Firefox y Safari no exponen <code>navigator.serial</code>.</p>' +
      '<p>Si lo abriste desde <code>file://</code> está OK (es contexto seguro). ' +
      'Si no, servilo con <code>python -m http.server</code> y entrá por ' +
      '<code>http://localhost</code>.</p></div>';
    return;
  }

  let port = null;
  let reader = null;
  let writer = null;
  let keepReading = false;
  const decoder = new TextDecoder();
  const encoder = new TextEncoder();
  let rxBuffer = "";          // acumulador para partir por líneas
  let lineCount = 0;
  const MAX_LINES = 5000;     // tope para no colgar el DOM
  // Secuencias de color ANSI (p.ej. ESP-IDF: "\x1b[0;32mI (..)\x1b[0m"): las
  // quitamos para que el log se lea limpio. El nivel I/W/E lo resaltamos aparte.
  const ANSI_RE = /\x1b\[[0-9;]*m/g;

  const pad = (n) => String(n).padStart(2, "0");
  const stamp = () => {
    const d = new Date();
    return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" +
           pad(d.getSeconds()) + "." + String(d.getMilliseconds()).padStart(3, "0");
  };

  function append(text, cls) {
    const line = document.createElement("div");
    line.className = "line";

    if ($("timestamps").checked) {
      const ts = document.createElement("span");
      ts.className = "ts";
      ts.textContent = stamp();
      line.appendChild(ts);
    }

    const body = document.createElement("span");
    body.className = cls || "rx";
    // resaltado por nivel de log del firmware: "E (123) tag: ..."
    if (cls === "rx") {
      const m = /^([EWID])\s*\(/.exec(text);
      if (m) body.classList.add("lvl-" + m[1]);
    }
    body.textContent = text;
    line.appendChild(body);

    logEl.appendChild(line);
    lineCount++;
    if (lineCount > MAX_LINES) {
      logEl.removeChild(logEl.firstChild);
      lineCount--;
    }
    if ($("autoscroll").checked) logEl.scrollTop = logEl.scrollHeight;
  }

  function sys(text) { append(text, "sys"); }

  function setStatus(connected, label) {
    const dot = $("dot"), st = $("status");
    dot.className = "dot " + (connected ? "on" : "off");
    st.textContent = label;
    st.style.color = connected ? "var(--ok)" : "var(--dim)";
    $("connect").textContent = connected ? "Desconectar" : "Conectar";
    $("connect").classList.toggle("danger", connected);
    $("connect").classList.toggle("primary", !connected);
    $("baud").disabled = connected;
    $("send").disabled = !connected;
  }

  function feed(chunk) {
    rxBuffer += chunk;
    let idx;
    while ((idx = rxBuffer.indexOf("\n")) >= 0) {
      let line = rxBuffer.slice(0, idx);
      rxBuffer = rxBuffer.slice(idx + 1);
      if (line.endsWith("\r")) line = line.slice(0, -1);
      line = line.replace(ANSI_RE, "");
      append(line, "rx");
    }
  }

  async function readLoop() {
    while (keepReading && port && port.readable) {
      try {
        reader = port.readable.getReader();
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          if (value) feed(decoder.decode(value, { stream: true }));
        }
      } catch (e) {
        if (keepReading) append("[read] " + e.message, "errline");
      } finally {
        try { reader.releaseLock(); } catch (_) {}
        reader = null;
      }
    }
    // vaciar lo que haya quedado sin \n
    if (rxBuffer) { append(rxBuffer, "rx"); rxBuffer = ""; }
  }

  async function connect() {
    try {
      port = await navigator.serial.requestPort();
    } catch (e) {
      return; // usuario canceló el diálogo
    }
    const baud = parseInt($("baud").value, 10);
    try {
      await port.open({ baudRate: baud });
    } catch (e) {
      sys("No se pudo abrir el puerto: " + e.message +
          " (¿ocupado por espflash u otra pestaña?)");
      port = null;
      return;
    }
    const info = port.getInfo ? port.getInfo() : {};
    const id = (info.usbVendorId != null)
      ? " [" + info.usbVendorId.toString(16).padStart(4,"0") + ":" +
              (info.usbProductId||0).toString(16).padStart(4,"0") + "]"
      : "";
    setStatus(true, baud + " baud" + id);
    sys("— conectado @ " + baud + " —");
    try { writer = port.writable.getWriter(); } catch (_) { writer = null; }
    keepReading = true;
    readLoop();
  }

  async function disconnect() {
    keepReading = false;
    try { if (reader) await reader.cancel(); } catch (_) {}
    try { if (writer) { writer.releaseLock(); writer = null; } } catch (_) {}
    try { if (port) await port.close(); } catch (e) { sys("[close] " + e.message); }
    port = null;
    setStatus(false, "desconectado");
    sys("— desconectado —");
  }

  async function send() {
    if (!writer) return;
    const inp = $("input");
    const text = inp.value;
    const payload = text + ($("crlf").checked ? "\r\n" : "\n");
    try {
      await writer.write(encoder.encode(payload));
      append("» " + text, "tx");
      inp.value = "";
    } catch (e) {
      append("[write] " + e.message, "errline");
    }
  }

  // --- eventos UI ---
  $("connect").addEventListener("click", () => port ? disconnect() : connect());
  $("clear").addEventListener("click", () => { logEl.innerHTML = ""; lineCount = 0; });
  $("send").addEventListener("click", send);
  $("input").addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });

  $("save").addEventListener("click", () => {
    const lines = [...logEl.querySelectorAll(".line")]
      .map((l) => l.textContent.replace(/\s+/g, " ").trim());
    const blob = new Blob([lines.join("\n") + "\n"], { type: "text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "serial-" + new Date().toISOString().replace(/[:.]/g, "-") + ".log";
    a.click();
    URL.revokeObjectURL(a.href);
  });

  // reconexión transparente si el cable se desenchufa y vuelve
  navigator.serial.addEventListener("disconnect", (e) => {
    if (port && e.target === port) {
      sys("— cable desconectado —");
      disconnect();
    }
  });

  setStatus(false, "desconectado");
  sys('Listo. Pulsá "Conectar" y elegí el puerto del nodo.');
})();
</script>
</body>
</html>
